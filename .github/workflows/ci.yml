name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: meetings
          POSTGRES_PASSWORD: meetings
          POSTGRES_DB: meetings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetings"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://meetings:meetings@localhost:5432/meetings
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache
      # Everything here runs keyless: tests use fakes and the eval never calls a model.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Restore embedding model cache
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-Xenova-bge-small-en-v1.5
      - run: npm run eval
      - run: npm run build

  # The web app needs neither Postgres nor the embedding model, so it gets its own fast job and its own signal.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace apps/web
      - run: npm run lint --workspace apps/web
      - run: npm test --workspace apps/web
      - run: npm run build --workspace apps/web
      - name: The bundle carries no key material
        run: |
          test -f apps/web/dist/index.html
          if grep -rIl 'sk-ant' apps/web/dist; then echo "found key-shaped text in the web bundle"; exit 1; fi

  compose-smoke:
    needs: [test, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the api to be healthy
        run: |
          set -o pipefail
          for i in $(seq 1 36); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q api)")
            echo "api health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker compose logs api
          exit 1
      - name: Health reports retrieval-only
        run: |
          set -o pipefail
          curl --fail-with-body -sS http://localhost:3001/api/health | jq -e '.mode == "retrieval-only"'
      - name: One ask streams to done
        run: |
          set -o pipefail
          curl --fail-with-body -sS -N -X POST http://localhost:3001/api/ask \
            -H 'content-type: application/json' \
            -d '{"question":"What price was agreed for the Starter plan?"}' | tee ask.txt
          grep -q 'event: done' ask.txt
      - name: Wait for nginx to accept connections
        # The web container starts only after the api is healthy, so it can still be booting here.
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 2
          done
          docker compose logs web
          exit 1
      - name: The web app is served and proxies the API through nginx
        run: |
          set -o pipefail
          curl --fail-with-body -sS http://localhost:5173/ | grep -q '<div id="root">'
          # A deep link must serve the app, not a 404: the router handles /ask and /meetings/:id.
          curl --fail-with-body -sS http://localhost:5173/ask | grep -q '<div id="root">'
          curl --fail-with-body -sS http://localhost:5173/api/health | jq -e '.mode == "retrieval-only"'
          curl --fail-with-body -sS -N -X POST http://localhost:5173/api/ask \
            -H 'content-type: application/json' \
            -d '{"question":"What price was agreed for the Starter plan?"}' | tee ask-web.txt
          grep -q 'event: done' ask-web.txt
      - name: Tear down
        if: always()
        run: docker compose down -v
