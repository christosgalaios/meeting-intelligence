server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API takes bodies up to 8 MB (a 2 MB transcript, JSON-escaped).
  client_max_body_size 8m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's DNS, re-resolved every 10 s, so an api container that restarts with a new address does not leave nginx
  # pointing at the old one. Using a variable in proxy_pass is what makes nginx resolve at request time.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # POST /api/ask is server-sent events. Buffering would hold every token until the answer is complete.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Single-page app: unknown paths serve index.html so /ask and /meetings/:id survive a reload.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
  }
}
